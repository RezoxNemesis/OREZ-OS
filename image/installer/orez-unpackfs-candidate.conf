# OREZ candidate configuration: NOT ACTIVE, NOT APPROVED FOR INSTALLATION.
# Based on the verified Kubuntu 26.04.1 Calamares base unpack configuration.
# Calamares unpackfs supports multiple filesystem entries in this order.
# Do NOT place this under live /etc/calamares/ until tested on disposable VMs.
---
unpack:
  - source: "/cdrom/casper/filesystem.squashfs"
    sourcefs: "squashfs"
    destination: ""
    exclude:
      - "etc/sysctl.d/20-apparmor.conf"
  - source: "/cdrom/casper/orez-apps.squashfs"
    sourcefs: "squashfs"
    destination: ""
  - source: "/cdrom/casper/orez-install.squashfs"
    sourcefs: "squashfs"
    destination: ""
