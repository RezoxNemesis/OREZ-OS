---
# OREZ: copy the merged system (Kubuntu base + OREZ system layer) prepared by
# shellprocess@orez_source. The live-only layer is never copied.
unpack:
    -   source: "/run/orez-install/root"
        sourcefs: "file"
        destination: ""
        exclude:
            - "etc/sysctl.d/20-apparmor.conf"
