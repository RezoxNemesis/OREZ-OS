name: OREZ OS — login chain probe

# Diagnostic only. Runs on explicit one-shot build/probe-* branches.
on:
  push:
    branches:
      - 'build/probe-*'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch and verify signed Kubuntu base
        run: |
          df -h /mnt .
          sudo mkdir -p /mnt/orez && sudo chown "$USER" /mnt/orez
          sudo apt-get install -y -qq initramfs-tools-core zstd >/dev/null
          bash build/fetch-verified-base.sh /mnt/orez/base | tee iso-path.txt
      - name: Replay SDDM Wayland session chain
        run: sudo bash build/probe-login-chain.sh "$(tail -1 iso-path.txt)" dist/login-probe
      - name: Summary
        if: always()
        run: |
          sudo chown -R "$USER" dist || true
          { echo '### Login chain probe'; echo '```'; cat dist/login-probe/SUMMARY.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          for f in dist/login-probe/*.log; do echo "===== $f"; tail -60 "$f"; done
          cat dist/login-probe/inventory.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: orez-login-probe
          path: dist/login-probe/
          retention-days: 14
