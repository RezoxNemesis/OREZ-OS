name: OREZ isolated package integration
on:
  workflow_dispatch:
    inputs:
      desktop_capabilities:
        description: 'Also provision and test native Plasma, Blender and desktop capabilities'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: orez-package-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # CI deliberately builds only the dependencies requested by this workflow.
      OREZ_PACKAGE_IMAGE: orez-package-test:20261105
      OREZ_DESKTOP_IMAGE: orez-desktop-test:20261105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Prepare evidence tools
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Build native package with evidence
        run: python3 build/run-with-evidence.py --name 'Native package build' --kind source --output dist/evidence/package-build -- bash build/package-shell.sh
      - name: Provision disposable Ubuntu dependency image
        run: |
          mkdir -p dist/evidence/container-setup
          docker build -f build/integration/Dockerfile -t orez-package-test:20261105 . 2>&1 | tee dist/evidence/container-setup/build.log
      - name: Test real package lifecycle and native window
        run: python3 build/run-with-evidence.py --name 'Package lifecycle and native KDE window' --kind package-container --timeout 300 --output dist/evidence/package-lifecycle -- bash build/test-package-container.sh dist/evidence/package-details
      - name: Test package upgrade and failure scenarios
        run: python3 build/run-with-evidence.py --name 'Local package version and failure scenarios' --kind package-container --timeout 300 --output dist/evidence/package-scenarios -- bash build/test-package-scenarios.sh dist/evidence/package-scenarios-details
      - name: Provision optional native desktop image
        if: inputs.desktop_capabilities
        run: docker build -f build/integration/Desktop.Dockerfile -t orez-desktop-test:20261105 . 2>&1 | tee dist/evidence/container-setup/desktop-build.log
      - name: Test actual desktop windows and session recovery
        if: inputs.desktop_capabilities
        run: python3 build/run-with-evidence.py --name 'Native Plasma desktop scenarios' --kind package-container --timeout 420 --output dist/evidence/desktop -- bash build/run-desktop-container.sh dist/evidence/desktop-native-details
      - name: Test native creative and development capabilities
        if: inputs.desktop_capabilities
        env:
          OREZ_SCENARIO: capabilities
        run: python3 build/run-with-evidence.py --name 'Native capability scenarios' --kind package-container --timeout 420 --output dist/evidence/capabilities -- bash build/run-desktop-container.sh dist/evidence/capabilities-native-details
      - name: Collect gallery
        if: always()
        run: python3 build/collect-evidence.py dist/evidence
      - name: Preserve all evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orez-package-integration-evidence
          path: dist/evidence/
          retention-days: 7
