name: OREZ OS — live candidate

on:
  push:
    branches:
      - 'build/live-*'  # Explicit one-shot branches, not ordinary development pushes
  pull_request:
    paths:
      - 'build/**'
      - 'overlay/**'
      - 'tests/**'
      - '.github/workflows/orez-live.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orez-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: Validate OREZ code and Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout (pinned action)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Source and shell checks
        run: |
          python3 -m unittest discover -s tests -v
          bash build/package-shell.sh
          dpkg-deb --contents dist/orez-shell_0.1.0-1_all.deb | tail -20
      - name: Report exact status
        run: |
          echo '### OREZ source candidate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Native shell package built and source tests passed.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Bootable ISO, real UEFI/VM boot, drivers and installation: **not tested by this job**.' >> "$GITHUB_STEP_SUMMARY"

  live-image:
    name: Build full Kubuntu-derived live ISO (manual only)
    needs: source-validation
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check available disk before downloads
        run: |
          df -h .
          free_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          if (( free_kib < 11534336 )); then
            echo 'Insufficient space for 5.1 GB upstream + remixed ISO. Use a larger builder.' >&2
            exit 1
          fi
      - name: Install image construction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl gnupg xorriso squashfs-tools ca-certificates
      - name: Produce and verify development ISO
        id: iso
        run: |
          bash build/build-live.sh
          bash build/check-iso.sh dist/OREZ-OS-0.1-live-amd64.iso
          cat dist/build-report.txt
          echo '### ISO build produced — not hardware-certified' >> "$GITHUB_STEP_SUMMARY"
          cat dist/build-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'Full ISO is intentionally not uploaded to Actions artifacts: size and redistribution approvals remain unresolved.' >> "$GITHUB_STEP_SUMMARY"
      - name: Free upstream download and install VM boot tools
        run: |
          rm -f -- .cache/orez/kubuntu-26.04.1-desktop-amd64.iso
          df -h .
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf socat
      - name: Read-only Calamares installation source audit
        timeout-minutes: 4
        run: |
          bash build/check-installer-source.sh dist/OREZ-OS-0.1-live-amd64.iso
          echo '### Installer source not certified' >> "$GITHUB_STEP_SUMMARY"
          cat dist/boot-evidence/INSTALLER_READINESS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Prove casper loaded OREZ layer inside a disposable VM
        timeout-minutes: 11
        env:
          OREZ_QEMU_TIMEOUT: '480'
          OREZ_REQUIRE_GUI: '1'
        run: |
          bash build/test-casper-vm.sh dist/OREZ-OS-0.1-live-amd64.iso
          echo '### Guest boot proof: casper sees OREZ layer' >> "$GITHUB_STEP_SUMMARY"
          cat dist/boot-evidence/RESULT.txt >> "$GITHUB_STEP_SUMMARY"
          cat dist/boot-evidence/GUI_RESULT.txt >> "$GITHUB_STEP_SUMMARY"
          cat dist/boot-evidence/GUI_FRAME_RESULT.txt >> "$GITHUB_STEP_SUMMARY"
          echo '**This verifies direct Linux boot, NOT UEFI, Plasma graphics, NVIDIA, Secure Boot, installer or physical PC.**' >> "$GITHUB_STEP_SUMMARY"
      - name: Capture OVMF UEFI boot screen for visual review
        if: ${{ always() && steps.iso.outcome == 'success' }}
        timeout-minutes: 7
        env:
          OREZ_UEFI_CAPTURE_AFTER: '90'
          OREZ_UEFI_EXTRA_WAIT: '145'
        run: |
          bash build/test-uefi-vm.sh dist/OREZ-OS-0.1-live-amd64.iso
          echo 'UEFI screenshot captured; **NOT yet reviewed or certified.**' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve small VM evidence (never upload the ISO)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orez-casper-boot-evidence
          path: |
            dist/boot-evidence/casper-serial.log
            dist/boot-evidence/RESULT.txt
            dist/boot-evidence/INSTALLER_READINESS.txt
            dist/boot-evidence/upstream-unpackfs.conf
            dist/boot-evidence/upstream-live-apparmor.conf
            dist/boot-evidence/GUI_RESULT.txt
            dist/boot-evidence/GUI_FRAME_RESULT.txt
            dist/boot-evidence/gui-screen-22.ppm.gz
            dist/boot-evidence/gui-screen-24.ppm.gz
            dist/boot-evidence/try-prompt-before.ppm.gz
            dist/boot-evidence/qmp-try-result.log
            dist/boot-evidence/UEFI_RESULT.txt
            dist/boot-evidence/uefi-screen.ppm.gz
            dist/boot-evidence/uefi-screen-later.ppm.gz
            dist/boot-evidence/uefi-serial.log
            dist/build-report.txt
          if-no-files-found: warn
          retention-days: 2
